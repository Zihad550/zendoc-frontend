<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#000000" stroke-width="0.2" opacity="0.1"/>
    </pattern>
    
    <!-- Tiny Plus Pattern -->
    <pattern id="plus" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="9" y="6" width="2" height="8" rx="1" fill="#000000" opacity="0.1"/>
      <rect x="6" y="9" width="8" height="2" rx="1" fill="#000000" opacity="0.1"/>
    </pattern>
    
    <!-- Dots Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#000000" opacity="0.1"/>
      <circle cx="0" cy="0" r="1" fill="#000000" opacity="0.1"/>
      <circle cx="0" cy="20" r="1" fill="#000000" opacity="0.1"/>
      <circle cx="20" cy="0" r="1" fill="#000000" opacity="0.1"/>
      <circle cx="20" cy="20" r="1" fill="#000000" opacity="0.1"/>
    </pattern>
    
    <!-- Micro Medical Icons -->
    <pattern id="medical-icons" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Heartbeat -->
      <path d="M2,30 L10,30 L15,15 L20,45 L25,20 L30,30 L38,30" 
            stroke="#000000" fill="none" stroke-width="1" opacity="0.1"/>
      
      <!-- Tiny Cross -->
      <rect x="52" y="24" width="2" height="12" rx="1" fill="#000000" opacity="0.1"/>
      <rect x="47" y="29" width="12" height="2" rx="1" fill="#000000" opacity="0.1"/>
      
      <!-- Tiny Heart -->
      <path d="M20,55 C22,53 25,53 27,55 C29,57 29,59 27,61 L20,68 L13,61 C11,59 11,57 13,55 C15,53 18,53 20,55 Z" 
            fill="#000000" opacity="0.1"/>
      
      <!-- DNA Helix -->
      <path d="M48,4 C52,8 56,12 52,16 C48,20 52,24 56,28 C52,32 48,36 52,40 C56,44 52,48 48,52"
            stroke="#000000" fill="none" stroke-width="1" opacity="0.1"/>
      <path d="M44,4 C40,8 36,12 40,16 C44,20 40,24 36,28 C40,32 44,36 40,40 C36,44 40,48 44,52"
            stroke="#000000" fill="none" stroke-width="1" opacity="0.1"/>
    </pattern>
    
    <!-- Combined Pattern -->
    <pattern id="combined" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)" />
      <rect width="200" height="200" fill="url(#plus)" />
      <rect width="200" height="200" fill="url(#dots)" />
      <rect width="200" height="200" fill="url(#medical-icons)" />
    </pattern>
  </defs>
  
  <rect width="200" height="200" fill="url(#combined)" />
</svg>
