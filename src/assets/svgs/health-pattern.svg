<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Medical cross pattern -->
    <pattern id="medical-cross" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="25" y="10" width="10" height="40" rx="2" fill="currentColor" />
      <rect x="10" y="25" width="40" height="10" rx="2" fill="currentColor" />
    </pattern>
    
    <!-- Heart pattern -->
    <pattern id="heart" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M30,15 C35,10 40,10 45,15 C50,20 50,25 45,30 L30,45 L15,30 C10,25 10,20 15,15 C20,10 25,10 30,15 Z" 
            fill="currentColor" />
    </pattern>
    
    <!-- Pulse line pattern -->
    <pattern id="pulse" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0,30 L15,30 L20,15 L25,45 L30,20 L35,30 L60,30" 
            stroke="currentColor" fill="none" stroke-width="2" />
    </pattern>
    
    <!-- Stethoscope pattern -->
    <pattern id="stethoscope" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M25,15 C35,15 35,25 35,30 L35,40 C35,45 25,45 25,40 L25,35 C15,35 15,20 25,20 Z" 
            stroke="currentColor" fill="none" stroke-width="2" />
      <circle cx="25" cy="40" r="3" fill="currentColor" />
    </pattern>
    
    <!-- Main pattern combining all medical icons -->
    <pattern id="health-pattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#medical-cross)" />
      <rect x="60" y="0" width="60" height="60" fill="url(#heart)" />
      <rect x="0" y="60" width="60" height="60" fill="url(#pulse)" />
      <rect x="60" y="60" width="60" height="60" fill="url(#stethoscope)" />
    </pattern>
  </defs>
  
  <!-- Apply the pattern to the entire SVG -->
  <rect width="100%" height="100%" fill="url(#health-pattern)" />
</svg>
