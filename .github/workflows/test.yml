name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Type check
      run: pnpm type:check
      
    - name: Lint
      run: pnpm lint
      
    - name: Run tests
      run: pnpm test:run
      
    - name: Generate coverage report
      run: pnpm test:coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: romeovs/lcov-reporter-action@v0.3.1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        lcov-file: ./coverage/lcov.info
        
  performance:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run performance tests
      run: |
        echo "Running test performance analysis..."
        time pnpm test:run --reporter=verbose > test-performance.log 2>&1
        
    - name: Check test performance
      run: |
        # Extract test execution time
        EXECUTION_TIME=$(grep "Duration" test-performance.log | tail -1 | grep -o '[0-9.]*s' | head -1 | sed 's/s//')
        echo "Test execution time: ${EXECUTION_TIME}s"
        
        # Fail if tests take longer than 3 minutes (180 seconds)
        if (( $(echo "$EXECUTION_TIME > 180" | bc -l) )); then
          echo "❌ Tests are taking too long: ${EXECUTION_TIME}s (max: 180s)"
          exit 1
        else
          echo "✅ Test performance is acceptable: ${EXECUTION_TIME}s"
        fi
        
    - name: Upload performance report
      uses: actions/upload-artifact@v4
      with:
        name: test-performance-report
        path: test-performance.log
        
  coverage-check:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Check coverage thresholds
      run: |
        echo "Checking coverage thresholds..."
        pnpm test:coverage:threshold || {
          echo "❌ Coverage thresholds not met"
          echo "Please ensure your changes maintain or improve test coverage"
          exit 1
        }
        echo "✅ Coverage thresholds met"
        
    - name: Generate coverage badge
      run: |
        # Extract coverage percentage from coverage report
        COVERAGE=$(pnpm test:coverage --reporter=json | jq -r '.coverageMap | to_entries | map(.value.s) | add / length * 100' 2>/dev/null || echo "0")
        echo "Overall coverage: ${COVERAGE}%"
        
        # Create coverage badge data
        mkdir -p .github/badges
        echo "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"${COVERAGE}%\", \"color\": \"$([ ${COVERAGE%.*} -ge 80 ] && echo 'green' || echo 'red')\"}" > .github/badges/coverage.json
        
    - name: Upload coverage badge
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: .github/badges/coverage.json